# Contributor CI: build and run the full XCTest suite on every pull request
# that touches app code. Docs-only PRs (markdown, docs/, community files) skip
# the macOS runner entirely and pass via the cheap gate job.
#
# The required branch-protection check is "CI Gate", not "Build and Test":
# a skipped required check would block merges forever, so the gate always
# runs and passes when the suite either succeeded or was legitimately skipped.
#
# Uses no repository secrets, so PRs from forks get green CI too.
#
# Code signing is disabled (CODE_SIGNING_ALLOWED=NO) — fine for compile/test
# runs per TESTFLIGHT.md; the "simulator installs must be signed" rule applies
# to manual simulator testing, not CI.

name: PR CI

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_ios: ${{ steps.filter.outputs.run_ios }}
    steps:
      - name: Classify changed files
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[].filename')
          echo "Changed files:"
          echo "${files}"
          # Fail closed: anything NOT on the docs-only allowlist triggers the
          # full suite (including workflow, project, and config changes).
          non_docs=$(echo "${files}" | grep -vE '^(docs/.*|LICENSE|\.gitignore|\.github/ISSUE_TEMPLATE/.*|\.github/CODEOWNERS|\.github/dependabot\.yml|\.github/FUNDING\.yml|.*\.md)$' || true)
          if [[ -n "${non_docs}" ]]; then
            echo "Non-docs changes detected — running the full suite:"
            echo "${non_docs}"
            echo "run_ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docs-only change — skipping the macOS runner."
            echo "run_ios=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Build and Test
    needs: changes
    if: needs.changes.outputs.run_ios == 'true'
    runs-on: macos-26
    timeout-minutes: 90

    env:
      PROJECT_PATH: HermesMobile.xcodeproj
      SCHEME: HermesMobile

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Select simulator
        id: sim
        run: |
          set -euo pipefail
          selection=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          phones = [
              (device["name"], device["udid"])
              for runtime, devices in data["devices"].items()
              if "iOS" in runtime
              for device in devices
              if device.get("isAvailable") and device["name"].startswith("iPhone")
          ]
          preferred = "iPhone 17"
          selected = next((phone for phone in phones if phone[0] == preferred), phones[0] if phones else None)
          print("|".join(selected) if selected else "")
          ')
          if [[ -z "${selection}" ]]; then
            echo "No available iPhone simulator found:" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          name="${selection%%|*}"
          udid="${selection#*|}"
          echo "Using simulator: ${name}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "udid=${udid}" >> "$GITHUB_OUTPUT"

      - name: Build and test
        env:
          SIMULATOR_NAME: ${{ steps.sim.outputs.name }}
          SIMULATOR_UDID: ${{ steps.sim.outputs.udid }}
          MOCK_GATEWAY_PORT: "18791"
          MOCK_GATEWAY_TOKEN: hermes-mobile-ci-token
        run: |
          set -euo pipefail
          evidence_dir="artifacts/hermes-gateway-integration"
          fixture_dir=$(mktemp -d "${RUNNER_TEMP}/hermes-gateway.XXXXXX")
          mkdir -p "${evidence_dir}"

          printf '%s\n' \
            '[req]' \
            'distinguished_name=dn' \
            'x509_extensions=v3_ca' \
            'prompt=no' \
            '[dn]' \
            'CN=Hermes Mobile CI Root' \
            '[v3_ca]' \
            'basicConstraints=critical,CA:true' \
            'keyUsage=critical,keyCertSign,cRLSign' \
            'subjectKeyIdentifier=hash' \
            > "${fixture_dir}/ca.cnf"
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "${fixture_dir}/ca.key" \
            -out "${fixture_dir}/ca.crt" \
            -days 1 \
            -config "${fixture_dir}/ca.cnf" >/dev/null 2>&1
          openssl req -newkey rsa:2048 -nodes \
            -keyout "${fixture_dir}/server.key" \
            -out "${fixture_dir}/server.csr" \
            -subj "/CN=localhost" >/dev/null 2>&1
          printf '%s\n' \
            'subjectAltName=DNS:localhost,IP:127.0.0.1' \
            'extendedKeyUsage=serverAuth' \
            'basicConstraints=critical,CA:false' \
            'keyUsage=critical,digitalSignature,keyEncipherment' \
            > "${fixture_dir}/server.ext"
          openssl x509 -req \
            -in "${fixture_dir}/server.csr" \
            -CA "${fixture_dir}/ca.crt" \
            -CAkey "${fixture_dir}/ca.key" \
            -CAcreateserial \
            -out "${fixture_dir}/server.crt" \
            -days 1 \
            -extfile "${fixture_dir}/server.ext" >/dev/null 2>&1

          xcrun simctl boot "${SIMULATOR_UDID}" 2>/dev/null || true
          xcrun simctl bootstatus "${SIMULATOR_UDID}" -b
          xcrun simctl keychain "${SIMULATOR_UDID}" add-root-cert "${fixture_dir}/ca.crt"

          python3 ci/hermes_desktop_gateway_mock.py \
            --port "${MOCK_GATEWAY_PORT}" \
            --token "${MOCK_GATEWAY_TOKEN}" \
            --certificate "${fixture_dir}/server.crt" \
            --key "${fixture_dir}/server.key" \
            --receipt "${evidence_dir}/receipt.json" \
            > "${evidence_dir}/server.log" 2>&1 &
          gateway_pid=$!
          trap 'kill "${gateway_pid}" 2>/dev/null || true' EXIT

          gateway_ready=false
          for _ in {1..40}; do
            if [[ "$(curl --insecure --silent --output /dev/null --write-out '%{http_code}' "https://127.0.0.1:${MOCK_GATEWAY_PORT}/" || true)" == "401" ]]; then
              gateway_ready=true
              break
            fi
            sleep 0.25
          done
          if [[ "${gateway_ready}" != "true" ]]; then
            echo "Hermes Desktop gateway fixture did not become ready." >&2
            cat "${evidence_dir}/server.log" >&2
            exit 1
          fi

          integration_url="https://127.0.0.1:${MOCK_GATEWAY_PORT}"
          if [[ "${integration_url}" != "https://127.0.0.1:18791" || "${MOCK_GATEWAY_TOKEN}" != "hermes-mobile-ci-token" ]]; then
            echo "The XCTest fixture constants and CI gateway configuration have drifted." >&2
            exit 1
          fi

          integration_test='HermesMobileTests/HermesDesktopGatewayClientTests/testLiveTLSGatewayDiscoversAllProfilesAndCompletesPrompt'
          xcodebuild test \
            -project "${PROJECT_PATH}" \
            -scheme "${SCHEME}" \
            -destination "platform=iOS Simulator,name=${SIMULATOR_NAME}" \
            -resultBundlePath GatewayIntegration.xcresult \
            -parallel-testing-enabled NO \
            -only-testing:"${integration_test}" \
            'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) HERMES_GATEWAY_CI' \
            CODE_SIGNING_ALLOWED=NO

          python3 - "${evidence_dir}/receipt.json" <<'PY'
          import json
          import pathlib
          import sys

          receipt_path = pathlib.Path(sys.argv[1])
          if not receipt_path.is_file():
              raise SystemExit("Hermes gateway integration receipt was not written")
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          if receipt.get("websocket_connections") != 1:
              raise SystemExit(f"expected one authenticated WebSocket connection: {receipt.get('websocket_connections')!r}")
          expected_methods = ["profiles.list", "session.create", "prompt.submit"]
          if receipt.get("methods") != expected_methods:
              raise SystemExit(f"unexpected gateway methods: {receipt.get('methods')!r}")
          if receipt.get("profiles_requested_with_sessions") is not True:
              raise SystemExit("profiles.list did not request session data")
          if receipt.get("created_profile") != "research":
              raise SystemExit(f"session was not scoped to research: {receipt.get('created_profile')!r}")
          if receipt.get("prompt_text") != "Reply with the Hermes mobile gateway receipt":
              raise SystemExit("prompt receipt did not match the iOS request")
          print(json.dumps(receipt, indent=2))
          PY

          xcodebuild test \
            -project "${PROJECT_PATH}" \
            -scheme "${SCHEME}" \
            -destination "platform=iOS Simulator,name=${SIMULATOR_NAME}" \
            -resultBundlePath TestResults.xcresult \
            -parallel-testing-enabled NO \
            -skip-testing:"${integration_test}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Compile for a physical iPhone
        run: |
          set -euo pipefail
          xcodebuild build \
            -project "${PROJECT_PATH}" \
            -scheme "${SCHEME}" \
            -destination "generic/platform=iOS" \
            -derivedDataPath DeviceBuild \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            GatewayIntegration.xcresult
            TestResults.xcresult
          if-no-files-found: ignore

      - name: Upload Hermes gateway integration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hermes-mobile-gateway-integration
          path: artifacts/hermes-gateway-integration
          if-no-files-found: error

      - name: Launch Hermes and capture pairing screen
        env:
          SIMULATOR_UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -euo pipefail
          app_path=$(find "$HOME/Library/Developer/Xcode/DerivedData" \
            -path '*/Build/Products/Debug-iphonesimulator/HermesMobile.app' \
            -type d -print -quit)
          if [[ -z "${app_path}" ]]; then
            echo "HermesMobile.app was not produced by the test build." >&2
            exit 1
          fi

          codesign --force --deep --sign - --timestamp=none "${app_path}"
          xcrun simctl boot "${SIMULATOR_UDID}" 2>/dev/null || true
          xcrun simctl bootstatus "${SIMULATOR_UDID}" -b
          xcrun simctl uninstall "${SIMULATOR_UDID}" com.bkashjee.hermesmobile 2>/dev/null || true
          xcrun simctl install "${SIMULATOR_UDID}" "${app_path}"
          xcrun simctl launch "${SIMULATOR_UDID}" com.bkashjee.hermesmobile
          sleep 3
          mkdir -p artifacts
          xcrun simctl io "${SIMULATOR_UDID}" screenshot artifacts/hermes-pairing.png

      - name: Upload Hermes pairing preview
        uses: actions/upload-artifact@v7
        with:
          name: hermes-mobile-pairing-preview
          path: artifacts/hermes-pairing.png
          if-no-files-found: error

  gate:
    name: CI Gate
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        run: |
          set -euo pipefail
          echo "changes: ${{ needs.changes.result }}"
          echo "test: ${{ needs.test.result }}"
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "Path detection failed — failing the gate." >&2
            exit 1
          fi
          case "${{ needs.test.result }}" in
            success|skipped) echo "Gate passed." ;;
            *) echo "Build and Test did not pass — failing the gate." >&2; exit 1 ;;
          esac
